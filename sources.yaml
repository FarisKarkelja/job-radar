# Izvori koje Job Radar prati.
#
# Polja:
#   id        jedinstven naziv (bez razmaka)
#   name      naziv koji se vidi u notifikaciji
#   location  sarajevo = izvor objavljuje samo poslove u Sarajevu (sve prolazi)
#             bih      = cijela BiH: prolazi Sarajevo, remote/hybrid ili nepoznato;
#                        onsite u drugom gradu ili van BiH se ne šalje
#             abroad   = prakse/programi vani otvoreni za studente iz BiH (bez filtera lokacije)
#   scope     it       = svi oglasi su IT (IT firma, IT kategorija portala)
#             company  = poslodavac: IT oglasi + prakse/pripravnici
#             broad    = mješovit izvor: samo IT oglasi
#             program  = prakse vani: samo IT/tech (naslov ili tekst objave)
#   type      links (default) | rss | jsonld | page_hash | linkedin | workable | lever |
#             greenhouse | ashby | smartrecruiters | recruitee | personio | teamtailor |
#             breezy | workday
#   url       stranica sa oglasima
#   pattern   regex koji URL oglasa mora sadržavati
#   exclude   regex za linkove koje treba preskočiti
#   include   regex nad naslovom/firmom/lokacijom koji oglas mora zadovoljiti
#   loc_include  regex nad lokacijom (npr. samo evropski gradovi)
#   always    regex nad naslovom: takav oglas se uvijek šalje (npr. CERN Summer Student)
#   js        true ako se stranica učitava JavaScriptom (Chromium)
#   deep      true = otvori svaki novi oglas (i PDF) i traži IT pozicije u tekstu
#   min_items koliko oglasa mora biti nađeno da izvor važi kao ispravan (default 1)
#   enabled   false da privremeno isključiš izvor
sources:

  # ------------------------------------------------------------ portali
  - id: mojposao_it
    name: MojPosao IT
    location: bih
    category: portal
    url: https://www.mojposao.ba/pretraga-poslova?positions=IT&sortBy=adtype
    js: true
    pattern: 'mojposao\.ba/posao/'
    strip_query: true
    key_pattern: 'posao/([0-9a-f-]{36})'
    scope: broad

  - id: mojposao_ks
    name: MojPosao Kanton Sarajevo
    location: sarajevo
    category: portal
