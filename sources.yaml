    strip_query: true
    key_pattern: 'posao/([0-9a-f-]{36})'
    scope: broad

  - id: klix_it
    name: Klix Posao IT
    category: portal
    type: jsonld
    url: https://posao.klix.ba/kat/it-telekomunikacije
    pattern: 'posao\.klix\.ba/oglasi/'
    scope: broad

  - id: itbase
    name: ITBase
    category: portal
    url: https://itbase.ba/poslovi
    pattern: 'itbase\.ba/.*\d{3,}'
    exclude: 'itbase\.ba/(vijesti|blog|dogadjaji|kompanije)/'
    scope: it

  - id: workable_bih
    name: Workable BiH
    category: portal
    url: https://jobs.workable.com/search/bosnia-and-herzegovina/software-engineer-jobs
    js: true
    any_domain: true
    pattern: 'jobs\.workable\.com/view/'
    scope: it
