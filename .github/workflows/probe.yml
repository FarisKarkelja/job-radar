name: Proba izvora

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - probe.yaml
      - radar/probe.py

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instaliraj pakete
        run: pip install -r requirements.txt
      - name: Keš za Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Instaliraj Chromium
        run: python -m playwright install --with-deps chromium
      - name: Proba
        run: python -m radar.probe
      - name: Sačuvaj izvještaj
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "proba: izvještaj $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
