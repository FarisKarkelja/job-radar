# Kandidati koje radar/probe.py testira na GitHubu (bez notifikacija).
# Ispravni se prebacuju u sources.yaml. Runda 2: izvori koji u rundi 1 nisu radili.

sources:
  - {id: nato_sarajevo, name: NATO HQ Sarajevo, type: page_hash, js: true,
     url: https://jfcnaples.nato.int/hqsarajevo/about-sarajevo-/working-in-nhqsa/local-positions.aspx, location: sarajevo}
  - {id: eestec_sa, name: EESTEC Sarajevo, url: https://www.eestec-sa.ba/posts, js: true, location: sarajevo, scope: company}
  - {id: itkarijera_prakse, name: itkarijera prakse, url: https://itkarijera.ba/prakse, js: true, location: bih, scope: it,
     pattern: 'itkarijera\.ba/prakse/\d+'}
  - {id: itkarijera_poslovi, name: itkarijera poslovi, url: https://itkarijera.ba/poslovi, js: true, location: bih, scope: it,
     pattern: 'itkarijera\.ba/poslovi/\d+'}
  - {id: rolify, name: Rolify prilike, url: https://rolify.com/prilike/, location: bih, scope: company,
     pattern: 'rolify\.com/prilike/[^/]+/?$'}
  - {id: mreza_mira_intern, name: Mreža mira internships, url: https://www.mreza-mira.net/vijesti/volonterski-angazman-i-internships/,
     location: bih, scope: company, pattern: 'mreza-mira\.net/vijesti/volonterski-angazman-i-internships/[^/]+/?$'}
  - {id: osce_jobs, name: OSCE jobs, url: https://jobs.osce.org/vacancies, js: true, location: abroad, scope: program,
     include: '(bosnia|sarajevo|intern)'}
  - {id: mojposao_praksa, name: MojPosao praksa, url: 'https://www.mojposao.ba/pretraga-poslova?keyword=praksa',
     js: true, pattern: 'mojposao\.ba/posao/', strip_query: true, location: bih, scope: company}
  - {id: klix_praksa, name: Klix praksa, type: jsonld, url: 'https://posao.klix.ba/pretraga?q=praksa',
     pattern: 'posao\.klix\.ba/oglasi/', location: bih, scope: company}
  - {id: ibu_career, name: IBU Career Center, type: page_hash, url: https://www.ibu.edu.ba/career-center/, js: true, location: sarajevo}
  - {id: ssst_career, name: SSST karijere, type: page_hash, url: https://ssst.edu.ba/careers, js: true, location: sarajevo}
  - {id: etf_oglasi, name: ETF Sarajevo oglasi, url: https://www.etf.unsa.ba/, location: sarajevo, scope: company}
  - {id: optiver_eu, name: Optiver, type: greenhouse, board: optiverus, url: https://optiver.com, location: abroad, scope: it}

ats_slugs: []
